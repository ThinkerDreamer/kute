[package]
name = "kute"
version = "0.3.0"
edition = "2024"
rust-version = "1.89"
description = "Records, transcribes and summarizes your calls, locally"
license = "MIT OR Apache-2.0"
keywords = ["transcription", "whisper", "pipewire", "meetings"]
categories = ["command-line-utilities", "multimedia::audio"]

[features]
default = ["vulkan"]
vulkan = ["whisper-rs/vulkan"]
cuda = ["whisper-rs/cuda"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dirs = "7"
hound = "3"
jiff = { version = "0.2", features = ["serde"] }
ksni = { version = "0.3", default-features = false, features = ["blocking", "async-io"] }
libc = "0.2"
notify-rust = "4"
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
toml = "1"
toml_edit = "0.25"
ureq = { version = "3", features = ["json"] }
wait-timeout = "0.2"
whisper-rs = "0.16"

[dev-dependencies]
mockito = "1"

# Smaller release binary: no symbols, and whole-program optimization of the Rust code (whisper.cpp
# is C++ and unaffected). Panics still unwind: the worker catches them (`src/worker.rs`).
[profile.release]
strip = true
lto = true
codegen-units = 1
